# Continuous integration and delivery. See docs/ci-cd.md.
#
# Every push and pull request: install, type-check, lint, unit tests,
# dependency audit, then the full Playwright suite against a production
# build talking to a real MariaDB.
#
# Pushes to main additionally build the cPanel bundle and the Docker image,
# keep the bundle as a downloadable artifact, and — only if the repository
# has been given the deploy secrets — upload it to the server, run the
# migrations there and restart the app.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the run it supersedes, except on
  # main, where a deploy that has started must be allowed to finish.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1
  # Placeholders so the Prisma client and Auth.js initialise. The build
  # never connects (see src/lib/buildSafe.ts); the e2e job overrides both.
  DATABASE_URL: mysql://build:build@127.0.0.1:59999/build
  AUTH_SECRET: ci-placeholder-secret-not-used-in-production-0000000000
  NEXTAUTH_URL: http://localhost:3000

jobs:
  checks:
    name: Type-check, lint, unit tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      # Fails on any advisory not explicitly reviewed in
      # scripts/audit-dependencies.mjs.
      - run: npm run audit

  e2e:
    name: End-to-end (production build + MariaDB)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 45
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/news_platform
      MYSQL_PORT: "3306"
      # Real-looking values so the suite exercises the real code paths.
      AUTH_SECRET: ${{ secrets.E2E_AUTH_SECRET || 'e2e-only-secret-9f1c2b3a4d5e6f708192a3b4c5d6e7f8' }}
      LEGAL_ENTITY: CI Test Publisher
      LEGAL_ADDRESS: 1 Test Street, Testville
      LEGAL_CONTACT_EMAIL: privacy@example.com
      LEGAL_JURISDICTION: England and Wales
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Started by hand rather than as a `services:` container because the
      # server needs a startup flag: innodb_ft_min_token_size=2, or searches
      # for "AI" and "EU" match nothing and the search suite fails for a
      # reason that has nothing to do with the code. See docs/database.md.
      - name: Start MariaDB
        run: |
          docker run -d --name mariadb -p 3306:3306 \
            -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=yes \
            -e MARIADB_DATABASE=news_platform \
            mariadb:11 \
            --innodb-ft-min-token-size=2 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci
          for i in $(seq 1 60); do
            if docker exec mariadb mariadb-admin ping -uroot --silent 2>/dev/null; then
              echo "MariaDB is up"; exit 0
            fi
            sleep 1
          done
          echo "MariaDB did not start"; docker logs mariadb; exit 1

      # tests/e2e/support/db.ts drives the database through the `mysql`
      # client for the setup the app deliberately has no UI for.
      - name: Install MariaDB client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run seed

      # Fresh VAPID keys for this run only, so the push suite covers the
      # enabled path. They never leave the runner.
      - name: Generate throwaway VAPID keys
        # The script prints shell-style KEY="value" lines; GITHUB_ENV wants
        # them unquoted.
        run: node scripts/generate-vapid-keys.mjs | tr -d '"' >> "$GITHUB_ENV"

      - run: npx playwright install --with-deps chromium
      # Playwright's webServer builds and starts the production server.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  bundle:
    name: Build cPanel bundle
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    if: github.event_name != 'pull_request'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm run build:cpanel
      - name: Record what was built
        run: |
          echo "commit=${GITHUB_SHA}" > cpanel-dist/BUILD_INFO
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> cpanel-dist/BUILD_INFO
          du -sh cpanel-dist
      # Known vulnerabilities in the production packages, for the admin
      # System health page. Reports only; never blocks the build.
      - name: Record known vulnerabilities
        run: node scripts/write-audit-report.mjs cpanel-dist
      - uses: actions/upload-artifact@v4
        with:
          name: cpanel-dist
          path: cpanel-dist/
          # upload-artifact skips names starting with a dot unless told
          # otherwise, and the built site is .next/. Without this the
          # artifact had everything except the application itself, and the
          # deploy's rsync --delete then removed .next from the server:
          # "Could not find a production build in the './.next' directory".
          include-hidden-files: true
          retention-days: 14
          # The bundle is ~160MB of already-compressed node_modules; the
          # default level spends minutes for almost nothing.
          compression-level: 1

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'pull_request'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build only: proves the Dockerfile still works. Pushing to a
      # registry is a one-line addition once there is one to push to.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: news-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    needs: bundle
    # Only from main, and only once the five deploy secrets exist. The
    # repository variable is the switch: set CPANEL_DEPLOY=true under
    # Settings → Secrets and variables → Actions → Variables.
    if: github.ref == 'refs/heads/main' && vars.CPANEL_DEPLOY == 'true'
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cpanel-dist
          path: cpanel-dist

      # The upload below syncs the server to exactly this bundle, deleting
      # whatever the bundle lacks. So check the bundle is a working site
      # before anything touches the server. An artifact that silently lost
      # .next/ once got as far as the server and took the site down; with
      # this check it stops here, and the server keeps what it had.
      - name: Check the bundle is complete
        run: |
          missing=0
          for f in server.js package.json setup.js .next/BUILD_ID .next/required-server-files.json \
                   node_modules/next/package.json node_modules/mariadb/dist/promise.cjs; do
            if [ ! -e "cpanel-dist/$f" ]; then echo "missing from the bundle: $f"; missing=1; fi
          done
          [ -d cpanel-dist/.next/server ] || { echo "missing from the bundle: .next/server/"; missing=1; }
          [ -d cpanel-dist/.next/static ] || { echo "missing from the bundle: .next/static/"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to deploy an incomplete bundle. Nothing on the server was changed."
            exit 1
          fi
          echo "Bundle complete: build $(cat cpanel-dist/.next/BUILD_ID), $(du -sh cpanel-dist | cut -f1)"

      # One SSH connection for the whole deploy.
      #
      # Some hosts (Enhance, at least) throttle new SSH connections: after
      # a couple in quick succession they accept the TCP connection and
      # then reset it before the SSH banner, which reads as
      # "kex_exchange_identification: Connection reset by peer" and looks
      # exactly like SSH being switched off. This job used to open about
      # seven in a few seconds (ssh-keyscan alone opens one per key type),
      # so it tripped the limit before it had copied a file.
      #
      # Instead a single master connection is opened here, retried with
      # growing pauses in case the host is still counting an earlier burst,
      # and every later ssh and rsync rides on it through ControlPath.
      #
      # The host key: if CPANEL_SSH_KNOWN_HOSTS is set (the server's line
      # from a known_hosts file), only that key is accepted. Otherwise the
      # first key seen is trusted, which is what ssh-keyscan did before.
      - name: Open the SSH connection
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            checking=yes
          else
            checking=accept-new
          fi
          cat > ~/.ssh/config <<CFG
          Host deploy-target
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking $checking
            ConnectTimeout 20
            ServerAliveInterval 15
            ControlPath ~/.ssh/cm-%C
          CFG
          chmod 600 ~/.ssh/config
          for wait in 0 30 60 90 120; do
            [ "$wait" -gt 0 ] && { echo "Refused; trying again in ${wait}s"; sleep "$wait"; }
            if ssh -fN -o ControlMaster=yes -o ControlPersist=20m deploy-target; then
              ssh -O check deploy-target && exit 0
            fi
          done
          echo "Could not open an SSH connection to the server after five attempts."
          exit 1

      - name: Upload the bundle
        env:
          APP_ROOT: ${{ secrets.CPANEL_APP_ROOT }}
        # rsync over SSH: only changed files travel, and --delete keeps the
        # server from accumulating old chunks. .env and the upload folder
        # are the server's own and are never touched.
        run: |
          rsync -az --delete \
            --exclude '.env' --exclude '.env.*' \
            --exclude '.local-uploads/' --exclude 'tmp/' --exclude 'logs/' \
            --exclude 'setup-all.js' \
            -e ssh \
            cpanel-dist/ "deploy-target:$APP_ROOT/"

      - name: Migrate and restart
        env:
          APP_ROOT: ${{ secrets.CPANEL_APP_ROOT }}
          NODE_ACTIVATE: ${{ secrets.CPANEL_NODE_ACTIVATE }}
        # setup.js check/migrate use the server's own .env.
        #
        # Three things differ between hosts, and each is handled for both:
        #
        # - Where node comes from. cPanel's Node selector puts it on the
        #   PATH through an activate script (CPANEL_NODE_ACTIVATE). Enhance
        #   installs it through NVM, which a non-interactive SSH session
        #   does not load, so nvm.sh is sourced when it is there.
        #
        # - `check` reports conditions only the host can change, such as
        #   innodb_ft_min_token_size, and exits non-zero for them. That is
        #   worth reading in the log and not worth refusing a deploy over,
        #   so its exit status is ignored. `migrate` is the one that must
        #   succeed, and still stops the deploy if it does not.
        #
        # - How the app is restarted. Touching tmp/restart.txt is the
        #   signal on both hosts: Passenger (cPanel) watches it, and on
        #   Enhance the app watches it itself and exits
        #   (src/lib/restartOnDeploy.ts), after which Automatic mode starts
        #   the new version.
        #
        #   There is deliberately no `pkill -f "node server.js"` here. It
        #   was, and on Enhance it took the site down: the panel's own
        #   supervisor carries the startup command in its command line, so
        #   the pattern matched and killed it along with the app, leaving
        #   nothing to start the new version (503 until someone pressed
        #   Restart). The app exiting by itself leaves the supervisor
        #   alive, which is the whole point of doing it that way.
        run: |
          ssh deploy-target bash -s <<EOF
            set -e
            cd "$APP_ROOT"
            ${NODE_ACTIVATE:+eval "$NODE_ACTIVATE"}
            if [ -s "\$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="\$HOME/.nvm"
              . "\$NVM_DIR/nvm.sh" >/dev/null
            fi
            echo "node \$(node --version)"
            node setup.js check || echo "(check reported the above; not blocking the deploy)"
            node setup.js migrate
            echo "Deployed \$(tr '\n' ' ' < BUILD_INFO)"
            # Last, so the app restarts only once everything above is in place.
            mkdir -p tmp && touch tmp/restart.txt
            # Leftovers from a deploy that ran touch with extra arguments.
            rm -f echo Deployed\ commit=*
          EOF

      # "Answers 200" is not enough on its own: the old process answers
      # 200 too, so a restart that silently failed would pass. The health
      # endpoint reports the process's uptime, so wait until it is a fresh
      # process with a working database.
      #
      # The request goes to the server that was just deployed to, not to
      # wherever DNS happens to point. This checks the deploy; whether the
      # domain resolves correctly is a separate question, and a DNS fault
      # at the host once made every deploy look failed when none were.
      - name: Smoke test
        if: vars.SITE_URL != ''
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          site_host=$(printf '%s' "$SITE_URL" | sed -E 's#^[a-z]+://##; s#[/:].*$##')
          for i in $(seq 1 18); do
            body=$(curl -s --max-time 20 --resolve "$site_host:443:$SSH_HOST" "$SITE_URL/api/health" || true)
            uptime=$(printf '%s' "$body" | sed -n 's/.*"uptimeSeconds":\([0-9]*\).*/\1/p')
            if printf '%s' "$body" | grep -q '"database":"ok"' && [ -n "$uptime" ] && [ "$uptime" -lt 300 ]; then
              echo "New process is up (uptime ${uptime}s) and the database answers"; exit 0
            fi
            echo "Attempt $i: ${body:-no answer} — waiting for the restart"; sleep 10
          done
          echo "The site did not come back as a fresh process with a working database"; exit 1
