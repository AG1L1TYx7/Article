name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A throwaway database that only exists for the length of the job.
  DATABASE_URL: mysql://root:root@127.0.0.1:3306/news_platform_test
  # Not a secret: this database and this server are destroyed when the job
  # ends. A real deployment generates its own with `openssl rand -base64 32`.
  AUTH_SECRET: ci-only-throwaway-secret-not-used-anywhere-else
  NEXTAUTH_URL: http://localhost:3000
  MYSQL_DATABASE: news_platform_test
  MYSQL_PASSWORD: root

jobs:
  # Fast feedback: everything that needs neither a database nor a browser.
  checks:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Prisma client is generated, not committed, so nothing
      # type-checks until it exists.
      - run: npx prisma generate

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

      # Fails on any advisory that has not been reviewed and written down
      # in scripts/audit-dependencies.mjs, and also on entries there that
      # no longer apply. A plain "npm audit" would be permanently red on
      # advisories in the Prisma CLI's MySQL driver, which this PostgreSQL
      # app never loads — and a permanently red check is one nobody reads.
      - run: npm run audit

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: news_platform_test
        ports:
          - 3306:3306
        # Two words are load-bearing here. Without the health check the
        # first migration can race the server still starting up, and
        # without the lowered token size a search for "AI" or "EU"
        # silently matches nothing — see docs/database.md.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --innodb-ft-min-token-size=2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations
        # deploy, not dev: CI runs the committed migrations exactly as a
        # production deployment would, and fails rather than inventing a
        # new one if the schema has drifted.
        run: npx prisma migrate deploy

      - run: npx prisma generate

      - name: Seed starter categories
        # The article editor's category dropdown and the site header's
        # section list both come from these.
        run: npm run seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        # playwright.config.ts builds the app and serves it with
        # `next start` — deliberately not `next dev`, which compiles on
        # demand and produced failures that looked like application bugs.
        run: npm run test:e2e

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
