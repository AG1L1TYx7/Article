# Production stack for a single server. See docs/deployment.md.
#
# Start with:  docker compose up -d --build
# Upgrade with: git pull && docker compose up -d --build

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # innodb_ft_min_token_size defaults to 3, which would make "AI", "EU"
    # and "US" unsearchable. It can only be set at startup, so it lives
    # here rather than in a migration — see docs/database.md.
    command: --innodb-ft-min-token-size=2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-news_platform}
    volumes:
      - db-data:/var/lib/mysql
    # Deliberately not published to the host. The database is reachable
    # only from the other containers on this network; exposing 3306 to the
    # internet is how most self-hosted databases get found.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs once per deploy and exits. The app waits for it to finish, so two
  # app containers can never race each other through the same migration.
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Malware scanning for uploads. Video has no equivalent of the sharp
  # re-encode that neutralises an image, so without this the app holds
  # every video as PENDING and never serves it.
  #
  # The image downloads a ~250MB signature database on first start and
  # refreshes it daily, so give it a few minutes before the first upload.
  # Comment this service out (and CLAMAV_HOST) to run without video.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      # Persist the signature database so a restart is not another
      # 250MB download.
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      # Loading the database takes a while; do not mark it unhealthy
      # while it is still starting.
      start_period: 300s

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    # 127.0.0.1 is load-bearing, not caution. The app trusts
    # X-Forwarded-For for rate limiting and audit logs, so a directly
    # reachable port would let anyone spoof their own IP and walk past
    # every rate limit. The only route in must be the reverse proxy.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Only used when S3 is not configured. Without this, every upload is
      # lost on the next redeploy.
      - uploads:/app/.local-uploads

volumes:
  db-data:
  uploads:
  clamav-db:
